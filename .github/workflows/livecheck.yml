name: livecheck
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@main

      # Needed by pymarkdownlnt only. `brew bump-formula-pr` always calls
      # `PyPI.update_python_resources!` to regenerate resource stanzas, and that shells out
      # to `<python@3.13 keg>/bin/python -m pip install --dry-run`. `formula_opt_libexec`
      # builds that path without checking the keg exists, and
      # dawidd6/action-homebrew-bump-formula never passes `--install-dependencies` — so on a
      # bare ubuntu runner the pip call fails and bump-formula-pr odies with "Unable to
      # determine dependencies ... update the resources manually". The action rescues
      # per-formula but re-raises at the end, taking the whole job red.
      #
      # The other two formulae here have no Python resources, which is why this was not
      # needed before. Keep in step with `depends_on "python@3.x"` in
      # Formula/pymarkdownlnt.rb.
      - name: Install python@3.13 for Python resource regeneration
        run: brew install python@3.13

      - uses: dawidd6/action-homebrew-bump-formula@v5
        with:
          token: ${{ secrets.CALVINDOTSG_TAP_LIVECHECK_PAT }}
          no_fork: true
          formula: |
            calvindotsg/tap/opensrc
            calvindotsg/tap/cloudflare-cf
            calvindotsg/tap/pymarkdownlnt
          livecheck: true

  # Casks need a separate job: dawidd6/action-homebrew-bump-formula is formula-only
  # (no `cask:` input), so the job above can never bump a cask. Runs on macOS because
  # Homebrew has no cask support on Linux at all — not a livecheck-strategy limitation.
  #
  # Only casks WITHOUT `auto_updates true` belong here. firefoo and littlebird self-update,
  # so Homebrew deliberately doesn't own their upgrades; tmog cannot, so it does.
  #
  # `brew bump-cask-pr` opens `bump-<cask>-<version>` branches, which already satisfy
  # automerge.yml's `startsWith(head_branch, 'bump-')` gate — no change needed there.
  bump-casks:
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Bump outdated casks
        env:
          GH_TOKEN: ${{ secrets.CALVINDOTSG_TAP_LIVECHECK_PAT }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.CALVINDOTSG_TAP_LIVECHECK_PAT }}
          HOMEBREW_NO_INSTALL_FROM_API: 1
        run: |
          set -euo pipefail
          brew tap calvindotsg/tap
          # Homebrew 6.0+ requires non-official taps to be trusted before it will LOAD their
          # formulae/casks, and `brew tap` does NOT confer trust — only `brew trust` does
          # (it writes ~/.homebrew/trust.json). The fully-qualified names used below would
          # actually pass without this, because Homebrew treats a tap named in ARGV as explicit
          # consent. This line is belt-and-braces: it keeps the job working if a future edit
          # uses a bare token or a bulk command, both of which DO enforce trust (bulk ones fail
          # silently — "Skipping calvindotsg/tap because it is not trusted" — which would leave
          # casks quietly un-bumped). The `bump` job above already does this via
          # dawidd6/action-homebrew-bump-formula ("==> Trusting calvindotsg/tap tap...").
          # Idempotent: prints "Already trusted tap" and exits 0.
          brew trust --tap calvindotsg/tap
          for cask in tmog; do
            latest=$(brew livecheck --cask --newer-only --json "calvindotsg/tap/${cask}" \
                       | jq -r '.[0].version.latest // empty')
            if [ -z "${latest}" ]; then
              echo "${cask}: already current"
              continue
            fi
            echo "${cask}: bumping to ${latest}"
            brew bump-cask-pr --no-fork --no-browse --version "${latest}" \
              "calvindotsg/tap/${cask}"
          done
