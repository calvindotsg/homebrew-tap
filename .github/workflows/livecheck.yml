name: livecheck
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
# Every write here is made with the tap PAT, so the ambient GITHUB_TOKEN needs no
# scopes at all. This must ALSO be repeated per job: setup-homebrew copies
# `github.token` into HOMEBREW_GITHUB_API_TOKEN for the whole job, and `HOMEBREW_*`
# is what survives brew's `env -i` re-exec into subprocesses.
permissions: {}

# A manual dispatch near 07:00 UTC would otherwise race the cron onto the same
# `bump-<name>-<version>` branch — the non-fast-forward failure CLAUDE.md
# documents. Queue instead of cancelling: a half-finished bump leaves the tap
# clone dirty.
concurrency:
  group: livecheck
  cancel-in-progress: false

jobs:
  # Formulae with no Python resources. `brew bump-formula-pr` always calls
  # `PyPI.update_python_resources!`, but with an explicit `--version` (which the
  # action always passes in livecheck mode) that helper returns immediately
  # unless the formula's stable `url` is a files.pythonhosted.org sdist
  # (`ignore_non_pypi_packages: true` → early return in Library/Homebrew/utils/pypi.rb).
  # opensrc downloads a GitHub release binary and cloudflare-cf an npm tarball,
  # so neither ever reaches `pip`, and no upstream code executes in this job.
  # pymarkdownlnt does, which is why it has its own job below.
  bump:
    runs-on: ubuntu-latest
    # No upstream code runs here today — but that is a property of these two
    # formulae's URLs, not of the job. Add a PyPI-sourced formula to the list
    # below and `pip` would start running with whatever this job holds, so keep
    # the token powerless regardless. The action authenticates with the PAT.
    permissions: {}
    steps:
      - uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1

      - uses: dawidd6/action-homebrew-bump-formula@3428a0601bba3173ec0bdcc945be23fa27aa4c31 # v5
        with:
          token: ${{ secrets.CALVINDOTSG_TAP_LIVECHECK_PAT }}
          no_fork: true
          formula: |
            calvindotsg/tap/opensrc
            calvindotsg/tap/cloudflare-cf
          livecheck: true

  # pymarkdownlnt is sourced from a PyPI sdist, so `brew bump-formula-pr` calls
  # `PyPI.update_python_resources!` → `pip install --dry-run`, which builds each
  # candidate sdist and therefore executes its PEP 517 backend — arbitrary code
  # from around a dozen upstream projects, none of them ours. `Utils.popen_read`
  # only *adds* to the environment, so anything this job holds is inherited by
  # that subprocess.
  #
  # The bump is therefore split across two JOBS, not two steps. A step boundary
  # is not a credential boundary — steps share a runner, a $HOME and a git config,
  # so a hostile build backend could wait and influence a later step that holds the
  # PAT. Separate jobs get separate machines, and the only thing that crosses is
  # one file.
  #
  # `permissions: {}` on both is load-bearing rather than tidiness:
  # Homebrew/actions/setup-homebrew defaults `brew-gh-api-token` to
  # `${{ github.token }}` and its main.sh writes `HOMEBREW_GITHUB_API_TOKEN=<that>`
  # into $GITHUB_ENV for the whole job — and `HOMEBREW_*` is exactly what survives
  # brew's `env -i` re-exec into the pip subprocess, while `GITHUB_*` does not.
  # Confirmed in a live run: this job is granted `Metadata: read` and nothing else.
  #
  # Notes on the invocation, all verified against Homebrew HEAD:
  #   * `--write-only` writes the file and takes no git action at all
  #     (`return if args.write_only? && !args.commit?` in dev-cmd/bump-formula-pr.rb).
  #     That is now exactly what is wanted — the commit is made in the other job —
  #     so `--commit` is deliberately NOT passed, which also removes the
  #     shallow-clone handling the commit path needed.
  #   * `bump-formula-pr` raises UsageError without `--version`, hence the
  #     separate livecheck step.
  #   * python@3.13 must be installed or the resource regeneration shells out to
  #     a keg path that does not exist. Keep in step with `depends_on "python@3.x"`
  #     in Formula/pymarkdownlnt.rb.
  bump-python:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.lc.outputs.version }}
    env:
      FORMULA: pymarkdownlnt
    steps:
      - uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1

      - name: Prepare Homebrew
        shell: bash
        run: |
          set -euo pipefail
          brew developer on
          brew tap calvindotsg/tap
          # Homebrew 6.0+ refuses to load an untrusted non-official tap for bare
          # tokens and bulk commands (the latter skip silently). Idempotent.
          brew trust --tap calvindotsg/tap
          brew install python@3.13
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for a newer release
        id: lc
        shell: bash
        run: |
          set -euo pipefail
          version=$(brew livecheck --formula --quiet --newer-only --json \
                      "calvindotsg/tap/${FORMULA}" | jq -r '.[0].version.latest // empty')
          if [ -z "$version" ]; then
            echo "${FORMULA}: already current"
          else
            echo "${FORMULA}: newer release ${version}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rewrite the formula
        # The step that runs upstream code. Nothing in this job can reach a
        # credential, and nothing it leaves behind outlives the job except the
        # single file staged below.
        if: steps.lc.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ steps.lc.outputs.version }}
        run: |
          set -euo pipefail
          brew bump-formula-pr --write-only --no-browse \
            --version="$VERSION" "calvindotsg/tap/${FORMULA}"

      # Hand off exactly one file, under a fixed name. The publishing job decides
      # where it goes, so nothing produced here can choose its own destination.
      - name: Stage the rewritten formula
        if: steps.lc.outputs.version != ''
        shell: bash
        run: |
          set -euo pipefail
          tap_dir=$(brew --repo calvindotsg/tap)
          mkdir -p /tmp/out
          cp "${tap_dir}/Formula/${FORMULA}.rb" /tmp/out/formula.rb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.lc.outputs.version != ''
        with:
          name: rewritten-pymarkdownlnt
          path: /tmp/out/formula.rb
          if-no-files-found: error
          retention-days: 1

  # Publishes what the job above produced, on a fresh runner that has never run
  # upstream code. No brew here at all: it checks the repo out, drops the one file
  # into a path this job chooses, and opens the PR.
  bump-python-pr:
    needs: bump-python
    if: needs.bump-python.outputs.version != ''
    runs-on: ubuntu-latest
    permissions: {}
    env:
      FORMULA: pymarkdownlnt
      VERSION: ${{ needs.bump-python.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rewritten-pymarkdownlnt
          path: /tmp/in

      - name: Open the bump PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CALVINDOTSG_TAP_LIVECHECK_PAT }}
        run: |
          set -euo pipefail
          # VERSION crosses from the other job, so constrain it before it becomes a
          # ref name. It only ever reaches a branch name and a PR title — the file
          # path is the constant above — so the blast radius of a bad value is a
          # badly-named branch, not a wrong file.
          version_re='^[A-Za-z0-9][A-Za-z0-9._+-]*$'
          [[ "$VERSION" =~ $version_re ]] \
            || { echo "::error::version has an unexpected shape"; exit 1; }

          cp /tmp/in/formula.rb "Formula/${FORMULA}.rb"
          if git diff --quiet -- "Formula/${FORMULA}.rb"; then
            echo "No changes to Formula/${FORMULA}.rb; nothing to open."
            exit 0
          fi

          branch="bump-${FORMULA}-${VERSION}"
          if git ls-remote --exit-code --heads \
               "https://github.com/${GITHUB_REPOSITORY}" "$branch" >/dev/null 2>&1; then
            # ::warning:: rather than a silent skip: a bump PR that never merges
            # would otherwise make this job report green every day while nothing
            # actually bumps. It does not change the exit status.
            echo "::warning::${FORMULA}: branch $branch already exists upstream — an earlier bump PR is still open. Not re-pushing."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "Formula/${FORMULA}.rb"
          git commit -m "chore(${FORMULA}): bump to ${VERSION}"

          # PAT rather than github.token on purpose: a PR opened by github.token
          # does not trigger workflows, so brew test-bot would never run and
          # auto-merge would never fire.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            "HEAD:refs/heads/${branch}"

          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "${FORMULA} ${VERSION}" \
            --body "Automated bump to \`${VERSION}\` by the livecheck cron. Resource stanzas regenerated by \`brew bump-formula-pr\` in a job that held no credentials."

  # Casks need a separate job: dawidd6/action-homebrew-bump-formula is formula-only
  # (no `cask:` input), so the jobs above can never bump a cask. Runs on macOS because
  # Homebrew has no cask support on Linux at all — not a livecheck-strategy limitation.
  #
  # Only casks WITHOUT `auto_updates true` belong here. firefoo and littlebird self-update,
  # so Homebrew deliberately doesn't own their upgrades; tmog cannot, so it does.
  #
  # `brew test-bot` has no cask module at all — its library holds only formulae*.rb and
  # tap_syntax.rb — so a Casks/-only PR is style-checked and nothing more: no download, no
  # checksum recomputation, no URL resolution. A human reviewer cannot close that gap
  # either, because the diff is a version string plus a digest recomputed from the same
  # vendor response that served the file. The digest attests that the bytes have not
  # changed since Homebrew fetched them minutes earlier — not that they are the bytes the
  # vendor meant to ship. The signing-identity check below is the part a redirected or
  # tampered download cannot forge, so it runs before any PR is opened.
  bump-casks:
    runs-on: macos-latest
    # Same reason as bump-python: setup-homebrew copies `github.token` into
    # HOMEBREW_GITHUB_API_TOKEN for every later step, including the one that mounts
    # vendor-controlled media, so keep it powerless. The steps that need a
    # credential name the PAT explicitly.
    #
    # Not split across jobs the way bump-python is: nothing here executes upstream
    # code. The DMG is downloaded, hashed and read-only mounted, never run. The
    # residual is the filesystem driver parsing an untrusted image, which a job
    # boundary would not remove either.
    permissions: {}
    steps:
      - uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1

      - name: Write and commit outdated cask bumps
        id: bump
        shell: bash
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.CALVINDOTSG_TAP_LIVECHECK_PAT }}
          HOMEBREW_NO_INSTALL_FROM_API: 1
        run: |
          set -euo pipefail
          brew developer on
          brew tap calvindotsg/tap
          # Homebrew 6.0+ requires non-official taps to be trusted before it will LOAD their
          # formulae/casks, and `brew tap` does NOT confer trust — only `brew trust` does
          # (it writes ~/.homebrew/trust.json). The fully-qualified names used below would
          # actually pass without this, because Homebrew treats a tap named in ARGV as explicit
          # consent. This line is belt-and-braces: it keeps the job working if a future edit
          # uses a bare token or a bulk command, both of which DO enforce trust (bulk ones fail
          # silently — "Skipping calvindotsg/tap because it is not trusted" — which would leave
          # casks quietly un-bumped). Idempotent: prints "Already trusted tap" and exits 0.
          brew trust --tap calvindotsg/tap

          tap_dir=$(brew --repo calvindotsg/tap)
          base=$(git -C "$tap_dir" rev-parse HEAD)
          : > "${RUNNER_TEMP}/bumped.tsv"

          for cask in tmog; do
            latest=$(brew livecheck --cask --newer-only --json "calvindotsg/tap/${cask}" \
                       | jq -r '.[0].version.latest // empty')
            if [ -z "${latest}" ]; then
              echo "${cask}: already current"
              continue
            fi
            echo "${cask}: bumping to ${latest}"
            # Reset first so each cask's branch carries exactly one commit on top of
            # main, even when several casks bump in the same run.
            git -C "$tap_dir" reset --hard "$base"
            # --write-only --commit writes and commits but opens nothing: the PR
            # waits until the artifact check below has passed.
            brew bump-cask-pr --write-only --commit --no-browse \
              --version "${latest}" "calvindotsg/tap/${cask}"
            sha=$(git -C "$tap_dir" rev-parse HEAD)
            printf '%s\t%s\t%s\n' "${cask}" "${latest}" "${sha}" >> "${RUNNER_TEMP}/bumped.tsv"
          done

          if [ -s "${RUNNER_TEMP}/bumped.tsv" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the signing identity of each bumped artifact
        # No secret in scope, and the job token has no permissions: this step
        # downloads and mounts vendor-controlled media. A cask whose Developer ID
        # changed must never reach a PR.
        if: steps.bump.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tap_dir=$(brew --repo calvindotsg/tap)

          # Pinned Apple Developer ID Team Identifier per cask. A cask with no entry
          # here fails closed, so adding a cask to the loop above without pinning its
          # signing identity cannot silently skip verification.
          expected_team_for() {
            case "$1" in
              tmog) echo "25BPDA4NQ3" ;;  # Developer ID Application: David Plummer
              *)    echo "" ;;
            esac
          }

          # Read on fd 3 so brew/codesign/hdiutil cannot swallow the remaining lines.
          while IFS=$'\t' read -r cask version sha <&3; do
            expected=$(expected_team_for "$cask")
            if [ -z "$expected" ]; then
              echo "::error::${cask}: no pinned Team ID; refusing to bump unverified."
              exit 1
            fi

            # The bump loop resets the tap clone before each cask, so after it the
            # working tree holds only the last one. `brew fetch` and `brew info`
            # resolve a tap-qualified cask off disk, so check out this cask's own
            # commit first or every cask but the last is verified against its
            # pre-bump artifact.
            git -C "$tap_dir" reset --hard "$sha"

            brew fetch --cask --force "calvindotsg/tap/${cask}"
            dmg=$(brew --cache --cask "calvindotsg/tap/${cask}")
            mnt="${RUNNER_TEMP}/mnt-${cask}"
            mkdir -p "$mnt"
            hdiutil attach -nobrowse -quiet -readonly -mountpoint "$mnt" "$dmg"

            # Verify the bundle the cask actually installs, named by its own `app`
            # stanza — not whichever .app the image happens to list first. Signing is
            # a property of the bundle, not of its path, so a renamed copy of the
            # vendor's genuine app passes every check below while `app` installs a
            # different one; picking by find order would verify the decoy.
            app_rel=$(brew info --json=v2 --cask "calvindotsg/tap/${cask}" \
                        | jq -r '[.casks[0].artifacts[] | .app[]? | select(type == "string")][0] // empty')
            if [ -z "$app_rel" ]; then
              hdiutil detach -quiet "$mnt" || true
              echo "::error::${cask}: cask declares no app stanza; cannot verify."
              exit 1
            fi
            app="${mnt}/${app_rel}"
            if [ ! -d "$app" ]; then
              hdiutil detach -quiet "$mnt" || true
              echo "::error::${cask}: image does not contain '${app_rel}', which is what the cask installs."
              exit 1
            fi

            team=""
            ok=1
            codesign --verify --strict --deep "$app" || ok=0
            spctl -a -t open --context context:primary-signature "$app" || ok=0
            # `|| true` so an unsigned bundle reaches the explicit comparison below
            # rather than aborting the step with no explanation.
            team=$(codesign -dv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p' || true)
            hdiutil detach -quiet "$mnt" || true

            if [ "$ok" -ne 1 ]; then
              echo "::error::${cask} ${version}: code signature or notarization check failed."
              exit 1
            fi
            if [ "$team" != "$expected" ]; then
              echo "::error::${cask} ${version}: signing Team ID is '${team}', expected '${expected}'."
              exit 1
            fi
            echo "${cask} ${version}: signed by ${team} and notarized."
          done 3< "${RUNNER_TEMP}/bumped.tsv"

      - name: Push the commits and open the PRs
        if: steps.bump.outputs.any == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CALVINDOTSG_TAP_LIVECHECK_PAT }}
        run: |
          set -euo pipefail
          tap_dir=$(brew --repo calvindotsg/tap)
          cd "$tap_dir"
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            git fetch --unshallow origin
          fi

          # Read on fd 3 so git/gh cannot swallow the remaining lines.
          while IFS=$'\t' read -r cask version sha <&3; do
            # Cask versions can carry characters that are not valid in a ref name
            # (tmog's is "<version>,<build>"), so normalise before using one.
            safe=$(printf '%s' "$version" | tr -c 'A-Za-z0-9._-' '-')
            branch="bump-${cask}-${safe}"
            if git ls-remote --exit-code --heads \
                 "https://github.com/${GITHUB_REPOSITORY}" "$branch" >/dev/null 2>&1; then
              # ::warning:: so a stuck cask bump PR is visible rather than making
              # this job look healthy forever. Does not change the exit status.
              echo "::warning::${cask}: branch $branch already exists upstream — an earlier bump PR is still open. Not re-pushing."
              continue
            fi
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
              "${sha}:refs/heads/${branch}"
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "${cask} ${version}" \
              --body "Automated cask bump by the livecheck cron. Artifact code signature, notarization and pinned Developer ID Team Identifier were verified before this PR was opened."
          done 3< "${RUNNER_TEMP}/bumped.tsv"
