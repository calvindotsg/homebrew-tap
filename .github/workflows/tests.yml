name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # `brew bump-formula-pr` rewrites only the formula's top-level stable `url`
  # and `sha256` (Utils::AST::FormulaAST#replace_stable_stanza_value), so an
  # arch override nested in `on_intel`/`on_arm` is never touched by the
  # automated bump lane and silently strands that architecture on an old
  # release. Nothing else in CI notices: test-bot builds for the runner's own
  # architecture only. This guard fails the PR instead, so the divergence
  # surfaces at bump time rather than in a user's install months later.
  arch-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check per-formula release tags agree across architectures
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          for f in Formula/*.rb; do
            tags=$(grep -oE 'releases/download/[^/"]+/' "$f" | sed 's|releases/download/||; s|/$||' | sort -u)
            count=$(printf '%s\n' "$tags" | grep -c . || true)
            if [ "$count" -gt 1 ]; then
              joined=$(printf '%s\n' "$tags" | tr '\n' ' ')
              echo "::error file=$f::mixed upstream release tags in one formula: $joined"
              rc=1
            fi
          done
          exit "$rc"

  test-bot:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu covers the Linux-compatible CLIs (opensrc);
        # macos covers the macOS-only formulae (cc-menubar, mac-upkeep). test-bot
        # only builds the formulae changed in the PR, so cost stays proportional.
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
