name: Update formula
on:
  repository_dispatch:
    types: [formula-update]
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula name (without .rb)"
        required: true
      version:
        description: "Version tag (e.g., v1.1.0)"
        required: true
      url:
        description: "Source tarball URL"
        required: true
      type:
        description: "Formula type"
        required: true
        type: choice
        options: [python, node]

# Nothing here uses the ambient GITHUB_TOKEN. The half that runs upstream code
# holds no credential at all, and the half that publishes authenticates with the
# tap PAT. Note that `permissions:` governs `github.token` only — it must also be
# set per job, because Homebrew/actions/setup-homebrew (used by livecheck.yml)
# copies `github.token` into HOMEBREW_GITHUB_API_TOKEN for the whole job.
permissions: {}

concurrency:
  group: formula-update
  cancel-in-progress: false

jobs:
  # Everything that touches the dispatched URL — downloading it, and for Python
  # formulae `pip install`ing it, which executes the sdist's PEP 517 backend.
  # No secret and no writable token is in scope for any of it. The only thing
  # that leaves this job is one file.
  prepare:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      FORMULA: ${{ github.event.client_payload.formula || inputs.formula }}
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      URL: ${{ github.event.client_payload.url || inputs.url }}
      TYPE: ${{ github.event.client_payload.type || inputs.type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every value below arrives in a repository_dispatch client_payload and is
      # interpolated into a file path, a shell command and Ruby source. Constrain
      # each one to the shape it is supposed to have before any of that happens.
      - name: Validate dispatch payload
        shell: bash
        run: |
          set -euo pipefail

          formula_re='^[a-z0-9][a-z0-9._-]*$'
          version_re='^[A-Za-z0-9][A-Za-z0-9._+-]*$'
          # GitHub archives are constrained to the owner that actually dispatches
          # here; a bare `github.com` host check would let a dispatch repoint a
          # formula at any stranger's tarball. The two registries stay
          # host-scoped because package names vary and the path is not ours.
          url_re='^https://((github|codeload\.github)\.com/calvindotsg/|(registry\.npmjs\.org|files\.pythonhosted\.org)/)[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+$'

          [[ "$FORMULA" =~ $formula_re ]] \
            || { echo "::error::formula name has an unexpected shape"; exit 1; }
          [[ "$FORMULA" != *..* ]] \
            || { echo "::error::formula name has an unexpected shape"; exit 1; }
          test -f "Formula/$FORMULA.rb" \
            || { echo "::error::no such formula in this tap"; exit 1; }

          [[ "$VERSION" =~ $version_re ]] \
            || { echo "::error::version has an unexpected shape"; exit 1; }

          [[ "$URL" =~ $url_re ]] \
            || { echo "::error::source URL is not on an expected host"; exit 1; }

          case "$TYPE" in
            python|node) ;;
            *) echo "::error::type must be python or node"; exit 1 ;;
          esac

      # Homebrew rather than actions/setup-python: resource regeneration is now done
      # by `brew update-python-resources`, which needs brew and a python keg. The
      # small rewrites below use the runner's preinstalled python3 and stdlib only.
      - uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        if: env.TYPE == 'python'

      - name: Prepare Homebrew
        if: env.TYPE == 'python'
        shell: bash
        run: |
          set -euo pipefail
          brew tap calvindotsg/tap
          brew trust --tap calvindotsg/tap
          # Keep in step with `depends_on "python@3.x"` in the Python formulae.
          brew install python@3.13

      # shell: bash is what turns on pipefail (the Actions default for `run:` is
      # `bash -e` with pipefail OFF), so a failed download no longer leaves
      # shasum hashing an error page. -f makes curl exit non-zero on 4xx/5xx in
      # the first place, and the pattern check is the backstop.
      - name: Compute SHA256
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          SHA256=$(curl -fsSL --retry 3 "$URL" | shasum -a 256 | cut -d ' ' -f1)
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::did not get a usable checksum for the source URL"; exit 1; }
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Update URL and SHA256
        shell: bash
        env:
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import os
          import re

          # basename() a second time even though the payload was validated: the
          # path is what actually decides which file gets rewritten.
          name = os.path.basename(os.environ["FORMULA"])
          path = os.path.join("Formula", f"{name}.rb")
          url = os.environ["URL"]
          sha = os.environ["SHA256"]

          with open(path) as f:
              content = f.read()

          # A callable replacement is inserted literally. A plain rf"..." template
          # would have re interpret backslashes and \1-style group references that
          # happened to appear in the payload.
          def literal(value):
              return lambda m: m.group(1) + '"' + value + '"'

          content, n_url = re.subn(r'(  url )".*?"', literal(url), content, count=1)
          content, n_sha = re.subn(r'(  sha256 )".*?"', literal(sha), content, count=1)
          if n_url != 1 or n_sha != 1:
              print(f"::error::expected one url and one sha256 stanza, rewrote {n_url}/{n_sha}")
              raise SystemExit(1)

          with open(path, "w") as f:
              f.write(content)
          PYEOF

      # Resource regeneration. This still runs upstream code — `update-python-resources`
      # shells out to `pip install --dry-run`, which builds candidate sdists and
      # executes their PEP 517 backends — which is why this job holds no credential
      # and why `open-pr` re-checks what comes out of it.
      #
      # It replaces `pip install "$URL" homebrew-pypi-poet` + `poet -r`, which had
      # been failing in production since setuptools dropped `pkg_resources`: poet
      # died at import, the old `::warning::` fallback swallowed it, and the affected
      # formulae's resource pins silently froze while their bumps kept succeeding.
      # Homebrew's own command has no such dependency, and it applies a release
      # cooldown to the resolved dependencies that the previous path did not.
      # `--ignore-main-package-cooldown` exempts only the formula's own package,
      # which is ours and was just released on purpose.
      - name: Update Python resource blocks
        if: env.TYPE == 'python'
        shell: bash
        run: |
          set -euo pipefail
          # Fails the job rather than warning. A silent fallback is exactly how the
          # pins froze unnoticed: the bump still lands, so nothing looks wrong while
          # users stop receiving upstream fixes.
          if brew update-python-resources --print-only \
               --ignore-main-package-cooldown \
               --package-name="$FORMULA" \
               --version="${VERSION#v}" \
               "calvindotsg/tap/$FORMULA" > /tmp/resources.rb; then
            python3 << 'PYEOF'
          import os
          import re

          name = os.path.basename(os.environ["FORMULA"])
          path = os.path.join("Formula", f"{name}.rb")

          with open(path) as f:
              content = f.read()
          with open("/tmp/resources.rb") as f:
              # rstrip, never strip. `brew update-python-resources` emits blocks that
              # are already indented two spaces to sit in a formula body — pypi.rb
              # builds each one from a `<<-EOS` heredoc whose content lines carry the
              # indent literally — and the anchor below matches `  resource `, so the
              # replacement has to supply those two spaces back. Stripping them put the
              # first block at column 0. That still parses as Ruby, which is what made
              # it quiet: nothing failed here, and the only symptom was `open-pr`'s
              # shape allowlist rejecting the diff with
              # `unexpected change in Formula/<name>.rb: +resource "..." do`.
              resources = f.read().rstrip()

          # The indent is a contract with Homebrew's output, so assert it rather than
          # letting a future change to pypi.rb surface three jobs downstream as an
          # opaque allowlist rejection. This also catches a `# RESOURCE-ERROR:` line,
          # which pypi.rb emits ahead of the blocks when it cannot resolve a package —
          # a placeholder for a human, never something to commit.
          if resources and not resources.startswith("  resource "):
              first = resources.splitlines()[0]
              print(f"::error::update-python-resources output starts with {first!r}, "
                    "not an indented resource block; refusing to splice it")
              raise SystemExit(1)

          content, n_res = re.subn(
              r'(  resource .+?)(\n\n  def install)',
              lambda m: resources + m.group(2),
              content,
              count=1,
              flags=re.DOTALL,
          )
          # Guarded on `resources` because a dependency-free Python formula legitimately
          # has no resource stanzas to replace — that is n_res == 0 and correct.
          # Without the assertion, a change to the formula's layout would break the anchor
          # and this step would report success while committing a version bump whose
          # resource pins are still the old ones.
          if resources and n_res != 1:
              print("::error::could not locate the resource stanzas to replace; formula layout changed")
              raise SystemExit(1)

          with open(path, "w") as f:
              f.write(content)
          PYEOF
            echo "Resource blocks regenerated via brew update-python-resources"
          else
            echo "::error::brew update-python-resources failed for $FORMULA. Refusing to ship a version bump with frozen resource pins — resolve it and re-dispatch."
            exit 1
          fi

      # Hand off exactly one file, under a fixed name. The publishing job decides
      # where it goes, so nothing produced here can choose its own destination.
      - name: Stage the rewritten formula
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          cp "Formula/$FORMULA.rb" /tmp/out/formula.rb

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rewritten-formula
          path: /tmp/out/formula.rb
          if-no-files-found: error
          retention-days: 1

  # Publishes the result. Runs on a fresh runner, checks out again, and executes
  # nothing from upstream — so the PAT never shares a machine, a $HOME or a git
  # config with the code that ran above.
  open-pr:
    needs: prepare
    runs-on: ubuntu-latest
    permissions: {}
    env:
      # Re-read from the event rather than from `prepare`'s outputs: a job output
      # is written by a step that ran alongside the untrusted one, whereas the
      # event payload is fixed by GitHub before either job starts.
      FORMULA: ${{ github.event.client_payload.formula || inputs.formula }}
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Re-validate before using the payload as a path
        shell: bash
        run: |
          set -euo pipefail
          formula_re='^[a-z0-9][a-z0-9._-]*$'
          version_re='^[A-Za-z0-9][A-Za-z0-9._+-]*$'
          [[ "$FORMULA" =~ $formula_re ]] && [[ "$FORMULA" != *..* ]] \
            || { echo "::error::formula name has an unexpected shape"; exit 1; }
          test -f "Formula/$FORMULA.rb" \
            || { echo "::error::no such formula in this tap"; exit 1; }
          [[ "$VERSION" =~ $version_re ]] \
            || { echo "::error::version has an unexpected shape"; exit 1; }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rewritten-formula
          path: /tmp/in

      # The job split isolated the credential; it did not bound the outcome. The
      # artifact is a whole formula file produced by a job that ran upstream code,
      # and a formula's class body is evaluated by every `brew` command a tap user
      # runs. So nothing from that artifact is committed until it has been checked
      # here, by code that ran no third-party anything.
      #
      # Two layers. First the top-level url/sha256 are verified against trusted
      # inputs rather than merely pattern-matched: the URL must equal the one the
      # source repo dispatched, and the checksum is recomputed here from that URL —
      # downloading and hashing, never executing. Then a shape allowlist over the
      # remaining diff: a legitimate bump only ever rewrites url/sha256/version,
      # strips `revision`, and adds/removes/reorders whole `resource` blocks whose
      # URLs are on files.pythonhosted.org. Anything else — a `system` call, a
      # `caveats` block, a resource pointed off pythonhosted — is new Ruby, and
      # fails closed.
      - name: Verify the artifact before committing it
        shell: bash
        env:
          URL: ${{ github.event.client_payload.url || inputs.url }}
        run: |
          set -euo pipefail
          cp /tmp/in/formula.rb "Formula/$FORMULA.rb"

          file_url=$(sed -n 's/^  url "\(.*\)"$/\1/p' "Formula/$FORMULA.rb" | head -1)
          if [ "$file_url" != "$URL" ]; then
            echo "::error::formula url is '$file_url' but the dispatch said '$URL'"
            exit 1
          fi

          expected=$(curl -fsSL --retry 3 "$URL" | shasum -a 256 | cut -d ' ' -f1)
          file_sha=$(sed -n 's/^  sha256 "\([0-9a-f]\{64\}\)"$/\1/p' "Formula/$FORMULA.rb" | head -1)
          if [ "$file_sha" != "$expected" ]; then
            echo "::error::formula sha256 does not match a fresh hash of the dispatched URL"
            exit 1
          fi

          rc=0
          while IFS= read -r line; do
            case "$line" in
              '+++ '*|'--- '*|'@@ '*|'diff --git '*|'index '*) continue ;;
              [+-]*) ;;
              *) continue ;;
            esac
            body=${line:1}
            if   [[ "$body" =~ ^\ \ url\ \".*\"$ ]]; then continue
            elif [[ "$body" =~ ^\ \ sha256\ \"[0-9a-f]{64}\"$ ]]; then continue
            elif [[ "$body" =~ ^\ \ version\ \"[A-Za-z0-9._+-]+\"$ ]]; then continue
            elif [[ "$body" =~ ^\ \ revision\ [0-9]+$ ]]; then continue
            elif [[ "$body" =~ ^\ \ resource\ \"[A-Za-z0-9._-]+\"\ do$ ]]; then continue
            elif [[ "$body" =~ ^\ \ \ \ url\ \"https://files\.pythonhosted\.org/[^\"]*\"$ ]]; then continue
            elif [[ "$body" =~ ^\ \ \ \ sha256\ \"[0-9a-f]{64}\"$ ]]; then continue
            elif [[ "$body" =~ ^\ \ end$ ]]; then continue
            elif [ -z "$body" ]; then continue
            else
              echo "::error::unexpected change in Formula/$FORMULA.rb: $line"
              rc=1
            fi
          done < <(git diff -- "Formula/$FORMULA.rb")
          exit "$rc"

      - name: Open the bump PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CALVINDOTSG_TAP_LIVECHECK_PAT }}
        run: |
          set -euo pipefail

          if git diff --quiet -- "Formula/$FORMULA.rb"; then
            echo "No changes to Formula/$FORMULA.rb; nothing to open."
            exit 0
          fi

          # `bump-` prefix so automerge.yml's pre-filter sees it; the strict
          # authorization there is on the tested commit, not on this name.
          safe=$(printf '%s' "${VERSION#v}" | tr -c 'A-Za-z0-9._-' '-')
          branch="bump-${FORMULA}-${safe}"

          if git ls-remote --exit-code --heads \
               "https://github.com/${GITHUB_REPOSITORY}" "$branch" >/dev/null 2>&1; then
            echo "::warning::${FORMULA}: branch $branch already exists upstream — an earlier bump PR is still open. Not re-pushing."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "Formula/$FORMULA.rb"
          git commit -m "chore($FORMULA): bump to $VERSION"

          # Pushed and opened with the tap PAT rather than github.token on purpose:
          # a PR opened by github.token does not trigger workflows, so brew test-bot
          # would never run and auto-merge would never fire — the PR would sit open
          # and its branch would collide with the next dispatch.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            "HEAD:refs/heads/${branch}"

          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "$FORMULA $VERSION" \
            --body "Automated bump to \`$VERSION\`, dispatched by the source repository. URL and checksum recomputed, and Python resource stanzas regenerated, in a job that held no credentials."
