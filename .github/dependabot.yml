# Keeps the SHA pins in .github/workflows/*.yml current.
#
# Every `uses:` in this repo is pinned to a full 40-character commit SHA so a
# moved tag or a force-pushed branch cannot change what runs. Pins go stale, so
# Dependabot owns refreshing them: it reads the trailing `# <version>` comment,
# looks upstream for a newer release, and opens a PR that updates the SHA and
# the comment together.
#
# Dependabot PR branches are `dependabot/...`, not `bump-...`, so they are
# outside automerge.yml's filter — action updates always get a human.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
